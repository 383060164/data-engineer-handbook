version: '3'
services:
  jobmanager:
    image: apache/flink:1.18
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager

  taskmanager:
    image: apache/flink:1.18
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager

  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: flink
      POSTGRES_PASSWORD: flink123
      POSTGRES_DB: sessions
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql